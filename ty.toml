#@+leo-ver=5-thin
#@+node:ekr.20260821134304.1: * @file ../../ty.toml
# Config for `ty`: https://github.com/astral-sh/ty
# See the `ty` job in .github/workflows/ci.yml

[src]
include = ["leo"]
exclude = [

#@+<< ty.toml: exludes >>
#@+node:ekr.20260902044618.1: ** << ty.toml: exludes >>
    # Mirrors the [mypy] exclude list in .mypy.ini.
    "leo/doc",
    "leo/dist",
    "leo/editpane",
    "leo/examples",
    "leo/extensions",
    "leo/external",
    "leo/modes",
    "leo/scripts",
    "leo/themes",
    "leo/unittests",
    "leo/www",
    "leo/plugins/QNCalendarWidget.py",
    "leo/plugins/freewin.py",
    "leo/plugins/xdb_pane.py",
    "leo/test/scriptFile.py",
    "leo/plugins/beautify_node.py",
    "leo/plugins/viewrendered",  ###
    "leo/plugins/viewrendered3*",
    "leo/plugins/leo_pdf*",
    "leo/plugins/leo_to_rtf*",
    "leo/plugins/mnplugins*",
    "leo/plugins/mod_speedups*",
    "leo/plugins/qt_main*",
    "leo/plugins/settings_finder*",
    "leo/plugins/stickynotes_plus*",
    "leo/plugins/threadutil.py",
]
#@-<< ty.toml: exludes >>

[analysis]
strict-equality-semantics = true

[rules]


missing-attribute = "ignore"
missing-union-attribute = "ignore"

#@+<< ty.toml: rules >>
#@+node:ekr.20260902044553.1: ** << ty.toml: rules >>
# EKR's environment does not specify a path to python, so this suppression is required.
import-not-found = "ignore"  # Do not delete this.

# Warn about unused suppressions.
unused-ignore-comment = "ignore"       # Python 3.14 and 3.15 differ.
unused-type-ignore-comment = "ignore"  # Python 3.14 and 3.15 differ.

# Ignore warnings about overridden methods.
incompatible-method-override = "ignore"

# For now.
lost-keyword-for-regular-parameter = "ignore"
invalid-argument-type = "ignore"        # 83 failures with ty 0.0.105.
#@-<< ty.toml: rules >>
#@-leo
