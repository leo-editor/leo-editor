name: CI

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install ruff
      - run: ruff check leo

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # No display in CI; run Qt headless instead of pulling in xvfb.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: pip install asttokens Pygments "PyQt6>=6.6" PyQt6-QScintilla
      - run: python run_ci_unit_tests.py

  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "mypy<2" mypy-extensions typing_extensions
          types-docutils types-Markdown types-paramiko types-PyYAML
          types-requests types-six
          "PyQt6>=6.6" PyQt6-QScintilla PyQt6-WebEngine ty
          black Jinja2 Pygments
      # These 3 are optional runtime deps for individual plugins/commands
      # (leoBeautify.py, viewrendered.py, leoColorizer.py),
      # each guarded by 'try: import X except: X = None'. Installing them
      # here matches a typical dev environment (they're common enough to
      # often be present) so mypy/ty check the same code path CI and
      # contributors actually see, instead of only the ignore_missing_imports
      # fallback.
      - run: python -m mypy leo
      # Informational only: ty (https://github.com/astral-sh/ty) is an
      # actively-developed, much faster alternative to mypy, still in beta.
      # It's noticeably stricter than our current mypy config in some areas
      # (see ty.toml), so this step is not allowed to fail the build --
      # it's here so its findings show up in PR logs while we evaluate it.
      # Runs in this job, after mypy, to reuse the same checkout/Python/PyQt6
      # setup instead of paying for a second one.
      # - run: ty check --python "$(python -c 'import sys; print(sys.prefix)')" leo
      #  continue-on-error: true
